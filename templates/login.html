<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema - Extração de Notas Fiscais | UniRV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Barra Superior / Header Institucional -->
    <header class="app-header">
        <div class="header-container">
            <div class="brand-group">
                <div class="brand-badge">UniRV</div>
                <div class="brand-info">
                    <span class="brand-title">Prática de Engenharia de Software</span>
                    <span class="brand-subtitle">Avaliação N2 - Processamento Inteligente com LLM Gemini</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="auth-status-badge">
                    <i class="fa-solid fa-shield-halved"></i> Ambiente Autenticado
                </span>
            </div>
        </div>
    </header>

    <!-- Área Central de Login -->
    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon-badge">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h1 class="login-title">Acesso Restrito</h1>
                <p class="login-subtitle">Entre com suas credenciais para acessar o extrator de notas fiscais</p>
            </div>

            <form class="login-body" id="loginForm">
                <!-- Campo de E-mail -->
                <div class="form-group">
                    <label for="loginEmail">E-mail Institucional</label>
                    <div class="input-with-icon">
                        <input 
                            type="email" 
                            id="loginEmail" 
                            class="form-control" 
                            placeholder="admin@unirv.edu.br" 
                            value="admin@unirv.edu.br"
                            required
                            autocomplete="email"
                        >
                        <i class="fa-regular fa-envelope input-leading-icon"></i>
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div class="form-group">
                    <label for="loginPassword">Senha de Acesso</label>
                    <div class="input-with-icon">
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-control" 
                            placeholder="••••••••" 
                            value="admin123"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="btn-toggle-visibility" id="btnTogglePassword" title="Exibir/Ocultar Senha">
                            <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Credenciais de Demonstração (Para facilitar a avaliação da N2) -->
                <div class="demo-credentials-box">
                    <div class="demo-credentials-title">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Credenciais Padrão (Ambiente Acadêmico):</span>
                    </div>
                    <span><strong>E-mail:</strong> admin@unirv.edu.br</span>
                    <span><strong>Senha:</strong> admin123</span>
                </div>

                <!-- Botão de Login -->
                <button type="submit" class="btn-extract login-btn" id="btnLogin">
                    <span class="btn-text">
                        <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
                    </span>
                    <span class="btn-spinner hidden" id="loginSpinner">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> Autenticando...
                    </span>
                </button>
            </form>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Se já possuir token válido, redireciona direto para o painel principal
            const existingToken = localStorage.getItem('AUTH_TOKEN');
            if (existingToken) {
                window.location.href = 'index.html';
                return;
            }

            // Elementos
            const loginForm = document.getElementById('loginForm');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const btnLogin = document.getElementById('btnLogin');
            const loginSpinner = document.getElementById('loginSpinner');
            const btnTogglePassword = document.getElementById('btnTogglePassword');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');

            // Determina a URL base da API (local vs nuvem Render)
            const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
                ? ''
                : 'https://fineasy.onrender.com';

            // Alternar visibilidade da senha
            btnTogglePassword.addEventListener('click', () => {
                const isPassword = loginPassword.type === 'password';
                loginPassword.type = isPassword ? 'text' : 'password';
                togglePasswordIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            });

            // Envio do Formulário de Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = loginEmail.value.trim();
                const password = loginPassword.value.trim();

                if (!email || !password) {
                    showToast('Preencha o e-mail e a senha.', 'error');
                    return;
                }

                // Estado de carregamento
                btnLogin.disabled = true;
                btnLogin.querySelector('.btn-text').classList.add('hidden');
                loginSpinner.classList.remove('hidden');

                try {
                    const response = await fetch(`${API_BASE_URL}/api/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    let data;
                    try {
                        data = await response.json();
                    } catch (_) {
                        throw new Error(`Falha na resposta do servidor (HTTP ${response.status})`);
                    }

                    if (!response.ok) {
                        throw new Error(data.error || 'Credenciais inválidas.');
                    }

                    // Armazenar o token JWT e dados do usuário
                    localStorage.setItem('AUTH_TOKEN', data.token);
                    if (data.user) {
                        localStorage.setItem('AUTH_USER', JSON.stringify(data.user));
                    }

                    showToast('Autenticado com sucesso! Redirecionando...', 'success');

                    // Redireciona para o extrator
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 600);

                } catch (error) {
                    console.error('Erro de autenticação:', error);
                    showToast(error.message, 'error');
                } finally {
                    btnLogin.disabled = false;
                    btnLogin.querySelector('.btn-text').classList.remove('hidden');
                    loginSpinner.classList.add('hidden');
                }
            });

            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;

                let icon = 'fa-circle-info';
                if (type === 'success') icon = 'fa-circle-check';
                if (type === 'error') icon = 'fa-circle-exclamation';

                toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
                container.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3500);
            }
        });
    </script>
</body>
</html>
